global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ragmonitor-backend"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: "ragmonitor-api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
